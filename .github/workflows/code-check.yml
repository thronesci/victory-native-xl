name: Code Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Typecheck stays off until src's strict-mode errors from the 4182e8a
      # restructure are fixed; add `yarn run typecheck` back then.
      - name: Unit Test
        run: yarn run test
